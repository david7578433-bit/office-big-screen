<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0f4537;      /* RM Support logo green */
    --gold: #b8892d;
    --gold-light: #d9b56a;
    --ink: #2b2b2b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: #f5f3ef;
  }
  /* AROUND THE CARD: light colors flowing all the time, like a video (a big soft gradient that keeps sliding,
     with two light spots drifting the other way). */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255, 255, 255, .55), transparent 38%),
      radial-gradient(circle at 80% 70%, rgba(255, 255, 255, .45), transparent 38%),
      linear-gradient(115deg, #f9c9d8, #fde3b0, #c9ecd5, #c4def7, #ddd0f6, #f9c9d8);
    background-size: 200% 200%, 200% 200%, 400% 400%;
    animation: flow 14s ease-in-out infinite alternate;
  }
  @keyframes flow {
    0%   { background-position: 0% 0%, 100% 100%, 0% 50%; }
    100% { background-position: 100% 100%, 0% 0%, 100% 50%; }
  }
  /* ...with the marble's faint grey veins on top (pure CSS, no image). */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      linear-gradient(115deg, transparent 38%, rgba(140, 140, 150, .12) 39%, transparent 41%),
      linear-gradient(62deg, transparent 55%, rgba(140, 140, 150, .10) 56%, transparent 58.5%),
      linear-gradient(145deg, transparent 20%, rgba(150, 150, 160, .09) 21.5%, transparent 23%),
      linear-gradient(28deg, transparent 70%, rgba(150, 150, 160, .07) 71%, transparent 72.5%);
  }
  /* The line under the headline switches between phrases. */
  .rotator { display: grid; place-items: center; }
  .rotator > span { grid-area: 1 / 1; opacity: 0; transform: translateY(.5em); transition: opacity .7s ease, transform .7s ease; white-space: nowrap; }
  .rotator > span.on { opacity: 1; transform: none; transition-delay: .6s; }   /* the old line fades out first */
  /* Confetti layer over everything; clicks pass through. */
  #confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
  /* Direction signs in the marble space on each side of the card. */
  .way {
    position: relative; z-index: 1;
    flex: 1; align-self: stretch;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(6px, 1.2vh, 20px);
    color: var(--green);
  }
  .way svg { width: clamp(44px, 5.2vw, 110px); height: auto; }
  .way .places { display: flex; flex-direction: column; align-items: center; gap: clamp(2px, .5vh, 10px); }
  .way .place {
    font-family: "Source Sans 3", Arial, sans-serif;
    font-weight: 600;
    font-size: clamp(16px, min(1.7vw, 3vh), 40px);
    line-height: 1.1;
  }
  .card {
    position: relative; z-index: 1; overflow: hidden; isolation: isolate;
    flex: none;
    width: min(78vw, 140vh);
    height: 84vh;
    background: #fff;
    border-radius: clamp(16px, 1.6vw, 36px);
    box-shadow: 0 2vw 5vw rgba(40, 40, 40, .12), 0 .3vw .8vw rgba(40, 40, 40, .06);
    border-top: clamp(4px, .45vw, 10px) solid var(--gold-light);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: clamp(24px, 3.2vh, 60px) clamp(24px, 4vw, 90px) clamp(28px, 5vh, 90px);
    text-align: center;
  }
  /* INSIDE THE CARD: very light colors drifting all over, faint enough that the headline stays clear. */
  .card::before {
    content: ""; position: absolute; inset: -35%; z-index: -1;
    background:
      radial-gradient(circle at 25% 30%, rgba(249, 201, 216, .38), transparent 30%),
      radial-gradient(circle at 75% 28%, rgba(201, 236, 213, .38), transparent 30%),
      radial-gradient(circle at 62% 74%, rgba(196, 222, 247, .38), transparent 30%),
      radial-gradient(circle at 30% 78%, rgba(253, 227, 176, .38), transparent 30%),
      radial-gradient(circle at 50% 50%, rgba(221, 208, 246, .30), transparent 28%);
    animation: drift 20s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
    50%  { transform: translate(7%, -6%) rotate(50deg) scale(1.08); }
    100% { transform: translate(-7%, 6%) rotate(100deg) scale(1); }
  }
  .logo { height: clamp(90px, 20vh, 260px); width: auto; display: block; mix-blend-mode: multiply; }
  .middle { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 28px); }
  .headline {
    font-family: "Frank Ruhl Libre", "David", serif;
    font-weight: 700;
    font-size: clamp(72px, min(15vw, 26vh), 330px);
    line-height: 1;
    color: var(--green);
  }
  .label {
    font-family: "Source Sans 3", Arial, sans-serif;
    font-weight: 600;
    font-size: clamp(14px, min(1.7vw, 3vh), 40px);
    letter-spacing: .45em;
    padding-left: .45em;            /* balances the letter-spacing so it stays centered */
    color: var(--gold);
    text-transform: uppercase;
  }
  .rule { width: clamp(80px, 12vw, 260px); height: 2px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); }
  .bottom {
    font-size: clamp(20px, min(2.7vw, 4.8vh), 64px);
    font-weight: 400;
    color: var(--ink);
  }
  .bottom strong { color: var(--green); font-weight: 600; }
</style>
</head>
<body>
  <!-- LEFT SIGN: arrow points left. EDIT the place names below (one per line). -->
  <aside class="way" aria-label="To the left">
    <svg viewBox="0 0 100 60" aria-hidden="true"><path d="M96 30H14M36 6 10 30l26 24" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="places">
      <span class="place">Food</span>
      <span class="place">Restrooms</span>
    </div>
  </aside>

  <main class="card">
    <img class="logo" src="logo.jpg" alt="RM Support">

    <!-- EDIT BELOW: change only the text between the tags. Save, commit and push; the TV picks it up within a minute. -->
    <div class="middle">
      <h1 class="headline" lang="he" dir="rtl">מזל טוב</h1>
      <!-- The gold line switches between these every few seconds; add, remove or change lines freely. -->
      <div class="label rotator">
        <span class="on">Mazal Tov</span>
        <span>Congratulations</span>
        <span>¡Felicidades!</span>
      </div>
      <div class="rule" aria-hidden="true"></div>
    </div>
    <p class="bottom">The program is renewed till <strong>October 2027</strong></p>
    <!-- EDIT ABOVE -->
  </main>

  <!-- RIGHT SIGN: arrow points right. EDIT the place name below. -->
  <aside class="way" aria-label="To the right">
    <svg viewBox="0 0 100 60" aria-hidden="true"><path d="M4 30h82M64 6l26 24-26 24" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="places">
      <span class="place">HR</span>
    </div>
  </aside>

  <!-- Party-popper confetti from all around the screen (bottom, top, sides, middle), a pop every ~3 seconds. -->
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script>
  (() => {
    const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
    const COLORS = ["#0f4537", "#e8ec16", "#d9b56a", "#b8892d", "#1f8a70", "#ef6f6c", "#5b8def"];
    let W = 0, H = 0, dpr = 1, bits = [];
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const rnd = (a, b) => a + Math.random() * (b - a);
    // One popper: from (x, y), aimed up at `deg` (degrees; -90 = straight up), spreading out.
    const piece = (x, y, vx, vy, s, fade) => ({
      x, y, vx, vy, w: rnd(7, 15) * s, h: rnd(4, 8) * s, r: rnd(0, 6.28), vr: rnd(-0.25, 0.25),
      flip: rnd(0, 6.28), vf: rnd(0.08, 0.2), c: COLORS[(Math.random() * COLORS.length) | 0],
      round: Math.random() < 0.25, life: 1, fade,
    });
    // One pop: n pieces from (x, y), aimed at `deg` (-90 = straight up, 90 = down) +/- `spread`, at speeds vmin..vmax.
    function pop(x, y, deg, spread, vmin, vmax, n) {
      const s = Math.max(W, H) / 1000;           // scale with the screen
      for (let i = 0; i < n; i++) {
        const a = (deg + rnd(-spread, spread)) * Math.PI / 180, v = rnd(vmin, vmax) * s;
        bits.push(piece(x, y, Math.cos(a) * v, Math.sin(a) * v, s, rnd(0.0035, 0.0055)));
      }
    }
    // Poppers from all around the screen, a new place every time (David 10-21: "from the bottom, from the top, from
    // the middle - it should change the whole time"). Never the same kind twice in a row.
    const KINDS = {
      bottom: () => pop(rnd(0.08, 0.92) * W, H + 10, -90, 24, 15, 27, 75),               // shoots up from the floor
      top:    () => pop(rnd(0.08, 0.92) * W, -10, 90, 40, 4, 12, 70),                    // sprays down from the top
      left:   () => pop(-10, rnd(0.3, 0.85) * H, -38, 26, 13, 24, 70),                   // from the left side, up and in
      right:  () => pop(W + 10, rnd(0.3, 0.85) * H, -142, 26, 13, 24, 70),               // from the right side, up and in
      middle: () => pop(rnd(0.25, 0.75) * W, rnd(0.3, 0.65) * H, -90, 180, 5, 14, 80),   // a burst in all directions
    };
    let last = "";
    function burst() {
      if (bits.length < 1500) {                   // keep it light on the office PC
        const names = Object.keys(KINDS).filter((k) => k !== last);
        last = names[(Math.random() * names.length) | 0];
        KINDS[last]();
      }
      setTimeout(burst, rnd(2500, 3500));         // a pop every 3 seconds or so, never on a fixed beat (David: "make it normal")
    }
    function frame() {
      ctx.clearRect(0, 0, W, H);
      const s = Math.max(W, H) / 1000, g = s * 0.32, fall = s * 2.4;   // gravity, and paper's slow falling speed
      for (const b of bits) {
        b.vy += g; b.vx *= 0.985; b.vy *= 0.985;
        if (b.vy > 0) b.vx *= 0.96;              // on the way down: drift, don't sail off sideways
        if (b.vy > fall) b.vy = fall;
        b.flip += b.vf;
        b.x += b.vx + Math.sin(b.flip * 0.5) * 0.6 * s; b.y += b.vy; b.r += b.vr;
        if (b.vy > 0) b.life -= b.fade;          // fade on the way down
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, b.life));
        ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.scale(1, Math.cos(b.flip));   // paper flutter
        ctx.fillStyle = b.c;
        if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.h * 0.7, 0, 6.28); ctx.fill(); }
        else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      }
      bits = bits.filter((b) => b.life > 0 && b.y < H + 40);
      requestAnimationFrame(frame);
    }
    size(); addEventListener("resize", size);
    requestAnimationFrame(frame);
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(burst, 400));
  })();
  </script>

  <!-- Switch the line under the headline every 3.5 seconds. -->
  <script>
  (() => {
    const lines = [...document.querySelectorAll(".rotator > span")];
    let i = 0;
    if (lines.length > 1) setInterval(() => {
      lines[i].classList.remove("on");
      i = (i + 1) % lines.length;
      lines[i].classList.add("on");
    }, 3500);
  })();
  </script>

  <!-- Picks up edits without anyone touching the TV: every 60 seconds it checks the published page and reloads
       ONLY if the page changed, so the colors and confetti never jump. (Plus a fresh start every 6 hours.) -->
  <script>
  (() => {
    const url = () => location.pathname + "?check=" + Date.now();
    const get = () => fetch(url(), { cache: "no-store" }).then((r) => (r.ok ? r.text() : null)).catch(() => null);
    let first = null;
    get().then((t) => { first = t; });
    setInterval(() => get().then((t) => { if (t && first && t !== first) location.reload(); else if (t && !first) first = t; }), 60000);
    setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
  })();
  </script>
</body>
</html>
