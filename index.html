<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #0f4537;      /* RM Support logo green */
    --gold: #b8892d;
    --gold-light: #d9b56a;
    --ink: #2b2b2b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    /* Marble with faint grey veins (pure CSS, no image) over a base color that slowly moves through light
       colors, so the screen keeps changing. The white card stays still. */
    background-color: #f5f3ef;
    background-image:
      linear-gradient(115deg, transparent 38%, rgba(160, 160, 165, .10) 39%, transparent 41%),
      linear-gradient(62deg, transparent 55%, rgba(150, 150, 155, .08) 56%, transparent 58.5%),
      linear-gradient(145deg, transparent 20%, rgba(170, 170, 175, .07) 21.5%, transparent 23%),
      radial-gradient(ellipse at 18% 22%, rgba(255, 255, 255, .6), transparent 55%),
      radial-gradient(ellipse at 82% 78%, rgba(255, 255, 255, .55), transparent 50%),
      radial-gradient(ellipse at 70% 15%, rgba(220, 218, 214, .3), transparent 45%),
      radial-gradient(ellipse at 25% 85%, rgba(215, 213, 209, .28), transparent 45%);
    animation: tint 36s ease-in-out infinite;
  }
  @keyframes tint {
    0%, 100% { background-color: #fbe3e4; }   /* blush */
    20%      { background-color: #fdf0cf; }   /* cream */
    40%      { background-color: #dff3e4; }   /* mint */
    60%      { background-color: #dcebf8; }   /* sky */
    80%      { background-color: #ebe3f7; }   /* lavender */
  }
  /* The line under the headline switches between phrases. */
  .rotator { display: grid; place-items: center; }
  .rotator > span { grid-area: 1 / 1; opacity: 0; transform: translateY(.5em); transition: opacity .7s ease, transform .7s ease; white-space: nowrap; }
  .rotator > span.on { opacity: 1; transform: none; }
  /* Confetti layer over everything; clicks pass through. */
  #confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
  /* Direction signs in the marble space on each side of the card. */
  .way {
    flex: 1; align-self: stretch;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(6px, 1.2vh, 20px);
    color: var(--green);
  }
  .way svg { width: clamp(44px, 5.2vw, 110px); height: auto; }
  .way .places { display: flex; flex-direction: column; align-items: center; gap: clamp(2px, .5vh, 10px); }
  .way .place {
    font-family: "Source Sans 3", Arial, sans-serif;
    font-weight: 600;
    font-size: clamp(16px, min(1.7vw, 3vh), 40px);
    line-height: 1.1;
  }
  .card {
    flex: none;
    width: min(78vw, 140vh);
    height: 84vh;
    background: #fff;
    border-radius: clamp(16px, 1.6vw, 36px);
    box-shadow: 0 2vw 5vw rgba(40, 40, 40, .12), 0 .3vw .8vw rgba(40, 40, 40, .06);
    border-top: clamp(4px, .45vw, 10px) solid var(--gold-light);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: clamp(24px, 3.2vh, 60px) clamp(24px, 4vw, 90px) clamp(28px, 5vh, 90px);
    text-align: center;
  }
  .logo { height: clamp(90px, 20vh, 260px); width: auto; display: block; }
  .middle { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 28px); }
  .headline {
    font-family: "Frank Ruhl Libre", "David", serif;
    font-weight: 700;
    font-size: clamp(72px, min(15vw, 26vh), 330px);
    line-height: 1;
    color: var(--green);
  }
  .label {
    font-family: "Source Sans 3", Arial, sans-serif;
    font-weight: 600;
    font-size: clamp(14px, min(1.7vw, 3vh), 40px);
    letter-spacing: .45em;
    padding-left: .45em;            /* balances the letter-spacing so it stays centered */
    color: var(--gold);
    text-transform: uppercase;
  }
  .rule { width: clamp(80px, 12vw, 260px); height: 2px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); }
  .bottom {
    font-size: clamp(20px, min(2.7vw, 4.8vh), 64px);
    font-weight: 400;
    color: var(--ink);
  }
  .bottom strong { color: var(--green); font-weight: 600; }
</style>
</head>
<body>
  <!-- LEFT SIGN: arrow points left. EDIT the place names below (one per line). -->
  <aside class="way" aria-label="To the left">
    <svg viewBox="0 0 100 60" aria-hidden="true"><path d="M96 30H14M36 6 10 30l26 24" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="places">
      <span class="place">Food</span>
      <span class="place">Restrooms</span>
    </div>
  </aside>

  <main class="card">
    <img class="logo" src="logo.jpg" alt="RM Support">

    <!-- EDIT BELOW: change only the text between the tags. Save, commit and push; the TV picks it up within a minute. -->
    <div class="middle">
      <h1 class="headline" lang="he" dir="rtl">מזל טוב</h1>
      <!-- The gold line switches between these every few seconds; add, remove or change lines freely. -->
      <div class="label rotator">
        <span class="on">Mazal Tov</span>
        <span>Congratulations</span>
        <span>¡Felicidades!</span>
      </div>
      <div class="rule" aria-hidden="true"></div>
    </div>
    <p class="bottom">The program is renewed till <strong>October 2027</strong></p>
    <!-- EDIT ABOVE -->
  </main>

  <!-- RIGHT SIGN: arrow points right. EDIT the place name below. -->
  <aside class="way" aria-label="To the right">
    <svg viewBox="0 0 100 60" aria-hidden="true"><path d="M4 30h82M64 6l26 24-26 24" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="places">
      <span class="place">HR</span>
    </div>
  </aside>

  <!-- Party-popper confetti from all around the screen (bottom, top, sides, middle), about one pop a second, plus a light rain - so the screen always moves. -->
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script>
  (() => {
    const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
    const COLORS = ["#0f4537", "#e8ec16", "#d9b56a", "#b8892d", "#1f8a70", "#ef6f6c", "#5b8def"];
    let W = 0, H = 0, dpr = 1, bits = [];
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const rnd = (a, b) => a + Math.random() * (b - a);
    // One popper: from (x, y), aimed up at `deg` (degrees; -90 = straight up), spreading out.
    const piece = (x, y, vx, vy, s, fade) => ({
      x, y, vx, vy, w: rnd(7, 15) * s, h: rnd(4, 8) * s, r: rnd(0, 6.28), vr: rnd(-0.25, 0.25),
      flip: rnd(0, 6.28), vf: rnd(0.08, 0.2), c: COLORS[(Math.random() * COLORS.length) | 0],
      round: Math.random() < 0.25, life: 1, fade,
    });
    // One pop: n pieces from (x, y), aimed at `deg` (-90 = straight up, 90 = down) +/- `spread`, at speeds vmin..vmax.
    function pop(x, y, deg, spread, vmin, vmax, n) {
      const s = Math.max(W, H) / 1000;           // scale with the screen
      for (let i = 0; i < n; i++) {
        const a = (deg + rnd(-spread, spread)) * Math.PI / 180, v = rnd(vmin, vmax) * s;
        bits.push(piece(x, y, Math.cos(a) * v, Math.sin(a) * v, s, rnd(0.0035, 0.0055)));
      }
    }
    // A light, constant confetti rain across the whole screen, so it is never empty between bursts.
    const RAIN_PER_SEC = 25;
    function rain() {
      const s = Math.max(W, H) / 1000;
      let n = RAIN_PER_SEC / 60;                  // per frame (fractions add up over frames)
      while (n > 0) {
        if (Math.random() < Math.min(1, n)) bits.push(piece(rnd(0, W), rnd(-40, -10), rnd(-0.6, 0.6) * s, rnd(1, 2) * s, s, 0.0012));
        n -= 1;
      }
    }
    // Poppers from all around the screen, a new place every time (David 10-21: "from the bottom, from the top, from
    // the middle - it should change the whole time"). Never the same kind twice in a row.
    const KINDS = {
      bottom: () => pop(rnd(0.08, 0.92) * W, H + 10, -90, 24, 15, 27, 130),              // shoots up from the floor
      top:    () => pop(rnd(0.08, 0.92) * W, -10, 90, 40, 4, 12, 120),                   // sprays down from the top
      left:   () => pop(-10, rnd(0.3, 0.85) * H, -38, 26, 13, 24, 120),                  // from the left side, up and in
      right:  () => pop(W + 10, rnd(0.3, 0.85) * H, -142, 26, 13, 24, 120),              // from the right side, up and in
      middle: () => pop(rnd(0.25, 0.75) * W, rnd(0.3, 0.65) * H, -90, 180, 5, 14, 140),  // a burst in all directions
    };
    let last = "";
    function burst() {
      if (bits.length < 1500) {                   // keep it light on the office PC
        const names = Object.keys(KINDS).filter((k) => k !== last);
        last = names[(Math.random() * names.length) | 0];
        KINDS[last]();
      }
      setTimeout(burst, rnd(700, 1300));          // about one pop a second, never on a fixed beat
    }
    let raining = false;
    function frame() {
      ctx.clearRect(0, 0, W, H);
      if (raining) rain();
      const s = Math.max(W, H) / 1000, g = s * 0.32, fall = s * 2.4;   // gravity, and paper's slow falling speed
      for (const b of bits) {
        b.vy += g; b.vx *= 0.985; b.vy *= 0.985;
        if (b.vy > 0) b.vx *= 0.96;              // on the way down: drift, don't sail off sideways
        if (b.vy > fall) b.vy = fall;
        b.flip += b.vf;
        b.x += b.vx + Math.sin(b.flip * 0.5) * 0.6 * s; b.y += b.vy; b.r += b.vr;
        if (b.vy > 0) b.life -= b.fade;          // fade on the way down
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, b.life));
        ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.scale(1, Math.cos(b.flip));   // paper flutter
        ctx.fillStyle = b.c;
        if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.h * 0.7, 0, 6.28); ctx.fill(); }
        else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      }
      bits = bits.filter((b) => b.life > 0 && b.y < H + 40);
      requestAnimationFrame(frame);
    }
    size(); addEventListener("resize", size);
    requestAnimationFrame(frame);
    const start = () => { KINDS.left(); KINDS.right(); raining = true; setTimeout(burst, 900); };   // open with two at once
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(start, 400));
  })();
  </script>

  <!-- Switch the line under the headline every 3.5 seconds. -->
  <script>
  (() => {
    const lines = [...document.querySelectorAll(".rotator > span")];
    let i = 0;
    if (lines.length > 1) setInterval(() => {
      lines[i].classList.remove("on");
      i = (i + 1) % lines.length;
      lines[i].classList.add("on");
    }, 3500);
  })();
  </script>

  <!-- Reload every 60 seconds so the screen shows any change without anyone touching it. -->
  <script>setTimeout(()=>location.reload(),60000)</script>
</body>
</html>
