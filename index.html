<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<!-- WHAT THE SCREEN SAYS lives in config.json (until CareHub's admin page is live). This file is only the look. -->
<style>
  :root {
    --green: #0f4537;      /* RM Support logo green */
    --gold: #b8892d;
    --gold-light: #d9b56a;
    --ink: #2b2b2b;
    --box: min(78vw, 140vh);   /* width of the top bar and the card */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2vh;
    font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: #f5f3ef;
  }
  /* AROUND THE CARD: light colors flowing all the time, like a video (a big soft gradient that keeps sliding,
     with two light spots drifting the other way). */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255, 255, 255, .55), transparent 38%),
      radial-gradient(circle at 80% 70%, rgba(255, 255, 255, .45), transparent 38%),
      linear-gradient(115deg, #f9c9d8, #fde3b0, #c9ecd5, #c4def7, #ddd0f6, #f9c9d8);
    background-size: 200% 200%, 200% 200%, 400% 400%;
    /* slides back and forth, and slowly walks through ALL colors (one full round a minute) */
    animation: flow 14s ease-in-out infinite alternate, allcolors 60s linear infinite;
  }
  @keyframes allcolors { to { filter: hue-rotate(360deg); } }
  @keyframes flow {
    0%   { background-position: 0% 0%, 100% 100%, 0% 50%; }
    100% { background-position: 100% 100%, 0% 0%, 100% 50%; }
  }
  /* ...with the marble's faint grey veins on top (pure CSS, no image). */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      linear-gradient(115deg, transparent 38%, rgba(140, 140, 150, .12) 39%, transparent 41%),
      linear-gradient(62deg, transparent 55%, rgba(140, 140, 150, .10) 56%, transparent 58.5%),
      linear-gradient(145deg, transparent 20%, rgba(150, 150, 160, .09) 21.5%, transparent 23%),
      linear-gradient(28deg, transparent 70%, rgba(150, 150, 160, .07) 71%, transparent 72.5%);
  }

  /* TOP BAR: greeting | clock + dates | Monroe weather */
  .topbar {
    position: relative; z-index: 1;
    width: var(--box);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2vw;
    padding: 1.3vh 2.2vw;
    background: rgba(255, 255, 255, .7);
    border-radius: clamp(12px, 1.2vw, 28px);
    box-shadow: 0 .6vw 2vw rgba(40, 40, 40, .08);
    color: var(--green);
  }
  .greet { justify-self: start; }
  #greeting { font-family: "Frank Ruhl Libre", serif; font-weight: 700; font-size: clamp(22px, min(2.5vw, 4.4vh), 60px); line-height: 1.1; }
  .welcome { font-weight: 600; font-size: clamp(10px, min(.9vw, 1.6vh), 22px); letter-spacing: .3em; text-transform: uppercase; color: var(--gold); margin-top: .5vh; }
  .when { text-align: center; }
  #clock { font-weight: 600; font-size: clamp(36px, min(4.2vw, 7.4vh), 96px); line-height: 1; font-variant-numeric: tabular-nums; }
  #clock small, #nclock small { font-size: .42em; margin-left: .2em; letter-spacing: .05em; }
  .dates { font-size: clamp(13px, min(1.2vw, 2.2vh), 30px); color: var(--ink); margin-top: .5vh; white-space: nowrap; }
  .dates .dot { color: var(--gold); margin: 0 .6em; }
  /* zmanim line under the dates (David 10-21): netz, mincha gedola, shkiah - and on Friday candle lighting */
  .zmanim { font-family: "Frank Ruhl Libre", "David", serif; font-weight: 500; font-size: clamp(12px, min(1.15vw, 2.1vh), 28px); color: var(--green); margin-top: .5vh; white-space: nowrap; }
  .zmanim > span + span::before { content: "·"; color: var(--gold); margin: 0 .6em; }
  .zmanim bdi { font-family: "Source Sans 3", Arial, sans-serif; font-weight: 600; }
  .heb { font-family: "Frank Ruhl Libre", "David", serif; font-weight: 500; }
  .wx { justify-self: end; display: flex; align-items: center; gap: 1vw; text-align: left; }
  #wxIcon { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; font-size: clamp(30px, min(3.4vw, 6vh), 80px); line-height: 1; }
  #wxTemp { font-weight: 600; font-size: clamp(26px, min(2.8vw, 5vh), 66px); line-height: 1; }
  #wxText, #wxNext { font-size: clamp(12px, min(1.05vw, 1.9vh), 26px); color: var(--ink); white-space: nowrap; }
  #wxNext { color: #666; }

  /* MIDDLE ROW: sign | card | sign */
  .row { position: relative; z-index: 1; width: 100%; height: 74vh; display: flex; align-items: stretch; }

  /* The line under the headline switches between phrases. */
  .rotator { display: grid; place-items: center; }
  .rotator > span { grid-area: 1 / 1; opacity: 0; transform: translateY(.5em); transition: opacity .7s ease, transform .7s ease; white-space: nowrap; }
  .rotator > span.on { opacity: 1; transform: none; transition-delay: .6s; }   /* the old line fades out first */
  /* Confetti layer over everything; clicks pass through. It fades away when the Mazal Tov slide is not showing. */
  #confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; transition: opacity .8s ease; }
  /* Direction signs in the space on each side of the card. */
  .way {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(6px, 1.2vh, 20px);
    color: var(--green);
  }
  .way svg { width: clamp(44px, 5.2vw, 110px); height: auto; }
  .way .places { display: flex; flex-direction: column; align-items: center; gap: clamp(2px, .5vh, 10px); text-align: center; }
  .way .place {
    font-family: "Source Sans 3", Arial, sans-serif;
    font-weight: 600;
    font-size: clamp(16px, min(1.7vw, 3vh), 40px);
    line-height: 1.1;
  }
  .card {
    position: relative; overflow: hidden; isolation: isolate;
    flex: none;
    width: var(--box);
    background: #fff;
    border-radius: clamp(16px, 1.6vw, 36px);
    box-shadow: 0 2vw 5vw rgba(40, 40, 40, .12), 0 .3vw .8vw rgba(40, 40, 40, .06);
    border-top: clamp(4px, .45vw, 10px) solid var(--gold-light);
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(20px, 3vh, 56px) clamp(24px, 4vw, 90px) clamp(24px, 4.4vh, 80px);
    text-align: center;
  }
  /* INSIDE THE CARD: a few clear colors at a time (red, yellow, blue, green, ...) moving and changing fast,
     soft enough that the headline stays easy to read. */
  /* A big SQUARE layer (1.7 x the card's width), so its turning never uncovers a corner of the card. */
  .card::before {
    content: ""; position: absolute; z-index: -1;
    width: calc(var(--box) * 1.7); height: calc(var(--box) * 1.7);
    left: calc(var(--box) * -.35); top: calc(50% - var(--box) * .85);
    background:
      radial-gradient(circle at 25% 39%, rgba(255, 82, 82, .26), transparent 27%),    /* red */
      radial-gradient(circle at 75% 38%, rgba(255, 214, 10, .30), transparent 27%),   /* yellow */
      radial-gradient(circle at 64% 63%, rgba(56, 152, 255, .26), transparent 27%),   /* blue */
      radial-gradient(circle at 28% 64%, rgba(46, 204, 113, .26), transparent 27%),   /* green */
      radial-gradient(circle at 50% 50%, rgba(255, 140, 0, .16), transparent 23%);    /* orange */
    animation: drift 9s ease-in-out infinite alternate, cardcolors 14s linear infinite;
    opacity: 0; transition: opacity 1.2s ease;
  }
  /* David 10-21: the fun colors come ONLY on a happy slide (Mazal Tov, birthday, anniversary, welcome, shout-out);
     every other slide gets calm, grown-up colors (sage, sand, slate blue, taupe) that slowly shift. */
  .card.happy::before { opacity: 1; }
  .card:not(.happy)::before { animation-play-state: paused; }
  .card::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 22% 25%, rgba(255, 255, 255, .45), transparent 40%),
      linear-gradient(120deg, #d6e8dc, #f3e5c8, #d3e1f1, #ecd9d2, #d6e8dc);
    background-size: 200% 200%, 400% 400%;
    animation: calmflow 30s ease-in-out infinite alternate;
    transition: opacity 1.2s ease;
  }
  .card.happy::after { opacity: 0; animation-play-state: paused; }
  @keyframes calmflow {
    0%   { background-position: 0% 0%, 0% 50%; }
    100% { background-position: 100% 100%, 100% 50%; }
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
    50%  { transform: translate(8%, -7%) rotate(70deg) scale(1.1); }
    100% { transform: translate(-8%, 7%) rotate(140deg) scale(1); }
  }
  @keyframes cardcolors { to { filter: hue-rotate(360deg); } }
  .logo { height: clamp(80px, 17vh, 230px); width: auto; display: block; flex: none; mix-blend-mode: multiply; }

  /* QR codes in the card's top corners (only when set): the first top-right, the second top-left. */
  .qr {
    position: absolute; top: clamp(14px, 2.6vh, 48px); right: clamp(14px, 2vw, 48px);
    width: clamp(96px, 15vh, 210px);
    display: flex; flex-direction: column; align-items: center; gap: .6vh;
  }
  .qr.left { right: auto; left: clamp(14px, 2vw, 48px); }
  .qr canvas { width: 100%; height: auto; display: block; background: #fff; border-radius: clamp(6px, .6vw, 14px); box-shadow: 0 .3vw 1vw rgba(40, 40, 40, .12); image-rendering: pixelated; }
  .qr div { white-space: pre-line; font-weight: 600; font-size: clamp(11px, min(.85vw, 1.6vh), 22px); letter-spacing: .08em; color: var(--green); line-height: 1.15; }

  /* SLIDES: they take turns in the card, fading one into the next. */
  .stage { position: relative; flex: 1; width: 100%; }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transform: scale(.985); transition: opacity .9s ease, transform .9s ease;
  }
  .slide.on { opacity: 1; transform: none; transition-delay: .5s; }   /* the old slide fades out first */
  .slide.now { transition: none; }
  .middle { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 1.6vh, 28px); }
  .headline {
    font-family: "Frank Ruhl Libre", "David", serif;
    font-weight: 700;
    font-size: clamp(72px, min(15vw, 26vh), 330px);
    line-height: 1;
    color: var(--green);
  }
  .headline.sm { font-size: clamp(48px, min(6.6vw, 12vh), 160px); line-height: 1.05; }
  .label {
    font-family: "Source Sans 3", Arial, sans-serif;
    font-weight: 600;
    font-size: clamp(14px, min(1.7vw, 3vh), 40px);
    letter-spacing: .45em;
    padding-left: .45em;            /* balances the letter-spacing so it stays centered */
    color: var(--gold);
    text-transform: uppercase;
  }
  .rule { width: clamp(80px, 12vw, 260px); height: 2px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); }
  .bottom {
    flex: none;
    font-size: clamp(20px, min(2.7vw, 4.8vh), 64px);
    font-weight: 400;
    color: var(--ink);
  }
  .bottom strong { color: var(--green); font-weight: 600; }
  .names { display: flex; flex-direction: column; align-items: center; gap: .6vh; }
  .names span { font-family: "Frank Ruhl Libre", serif; font-weight: 500; font-size: clamp(28px, min(3.8vw, 6.8vh), 92px); line-height: 1.15; color: var(--ink); }
  .names.many span { font-size: clamp(20px, min(2.6vw, 4.6vh), 62px); }
  .msg { max-width: 88%; font-size: clamp(22px, min(2.7vw, 4.8vh), 64px); line-height: 1.3; white-space: pre-line; color: var(--ink); }
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 4vh 3vw; width: 100%; }
  .tile { flex: 0 0 28%; display: flex; flex-direction: column; align-items: center; gap: .6vh; }
  .num { font-family: "Frank Ruhl Libre", serif; font-weight: 700; font-size: clamp(40px, min(5.6vw, 10vh), 132px); line-height: 1; color: var(--green); font-variant-numeric: tabular-nums; }
  /* 5-day weather slide */
  .wxdays { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.6vw; width: 100%; margin-top: 2vh; }
  .wxday { display: flex; flex-direction: column; align-items: center; gap: 1vh; padding: 2.4vh .8vw; background: rgba(255, 255, 255, .6); border-radius: clamp(10px, 1.1vw, 26px); }
  .wxday .d { font-weight: 600; font-size: clamp(14px, min(1.6vw, 2.8vh), 38px); color: var(--green); }
  .wxday .i { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; font-size: clamp(36px, min(4.4vw, 7.8vh), 106px); line-height: 1; }
  .wxday .t { font-family: "Frank Ruhl Libre", serif; font-weight: 700; font-size: clamp(20px, min(2.4vw, 4.2vh), 58px); color: var(--ink); line-height: 1; }
  .wxday .t small { font-size: .7em; font-weight: 500; color: #777; }
  .wxday .x { font-size: clamp(11px, min(1.05vw, 1.9vh), 25px); color: #555; text-align: center; line-height: 1.25; }
  .what { font-weight: 600; font-size: clamp(14px, min(1.4vw, 2.5vh), 34px); color: #555; }

  /* MINCHA (David 10-21): a big pop-up over everything - from 15 minutes before Mincha a countdown
     ("מנחה אין 15 מינוט", one minute less each minute), then just "מנחה" for 15 minutes. */
  #mincha { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(15, 69, 55, .97); text-align: center; }
  #mincha .mbox { animation: popin .8s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes popin { from { transform: scale(.6); opacity: 0; } }
  .mword { font-family: "Frank Ruhl Libre", "David", serif; font-weight: 700; font-size: clamp(120px, 34vh, 520px); line-height: 1; color: #fff; }
  .mwhen { font-family: "Frank Ruhl Libre", "David", serif; font-weight: 500; font-size: clamp(40px, 11vh, 170px); line-height: 1.1; color: var(--gold-light); margin-top: 3vh; }

  /* ANNOUNCEMENT (David 10-21): typed in CareHub, pops up over everything right away, until its end time. */
  #announce { position: fixed; inset: 0; z-index: 21; display: flex; align-items: center; justify-content: center; background: rgba(15, 69, 55, .97); text-align: center; padding: 0 6vw; }
  #announce .abox { animation: popin .8s cubic-bezier(.2, 1.4, .4, 1) both; }
  #announce .alabel { font-weight: 600; font-size: clamp(16px, 3.4vh, 48px); letter-spacing: .4em; padding-left: .4em; text-transform: uppercase; color: var(--gold-light); }
  #announce .atext { font-family: "Frank Ruhl Libre", "David", serif; font-weight: 700; font-size: clamp(44px, min(6.4vw, 12vh), 170px); line-height: 1.15; color: #fff; margin-top: 3vh; white-space: pre-line; }

  /* REACHED THE GOAL (David 10-21: "every member when he reaches 60 units it pops up on the screen"): a happy pop-up
     with the name, once per person per day. */
  #reached { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden;
    background: linear-gradient(120deg, #0f4537, #1f8a70, #0f4537); }
  #reached::before { content: ""; position: absolute; inset: -30%;
    background: radial-gradient(circle at 25% 30%, rgba(255, 214, 10, .35), transparent 30%), radial-gradient(circle at 75% 70%, rgba(255, 82, 82, .3), transparent 30%), radial-gradient(circle at 70% 25%, rgba(56, 152, 255, .3), transparent 28%);
    animation: drift 9s ease-in-out infinite alternate, cardcolors 14s linear infinite; }
  #reached .rbox { position: relative; animation: popin .8s cubic-bezier(.2, 1.4, .4, 1) both; }
  #reached .remoji { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; font-size: clamp(60px, 16vh, 240px); line-height: 1; }
  #reached .rname { font-family: "Frank Ruhl Libre", "David", serif; font-weight: 700; font-size: clamp(56px, min(8vw, 15vh), 220px); line-height: 1.1; color: #fff; margin-top: 2vh; }
  #reached .rwhat { font-weight: 600; font-size: clamp(24px, min(3.4vw, 6.4vh), 92px); color: var(--gold-light); margin-top: 1.5vh; }
  /* photo slides */
  .photo { max-width: 100%; max-height: 50vh; border-radius: clamp(10px, 1vw, 24px); box-shadow: 0 1vw 3vw rgba(40, 40, 40, .18); object-fit: contain; background: #fff; }
  .photocap { font-family: "Frank Ruhl Libre", serif; font-weight: 500; font-size: clamp(20px, min(2.4vw, 4.2vh), 58px); color: var(--ink); margin-top: 1.4vh; }

  /* OFFICE CLOSED notice: a ribbon between the top bar and the card, a few days before a closed day. */
  .notice { position: relative; z-index: 1; width: var(--box); padding: 1vh 2vw; border-radius: clamp(10px, 1vw, 24px); background: var(--green); color: #fff; text-align: center; font-weight: 600; font-size: clamp(16px, min(1.6vw, 3vh), 40px); }
  .notice b { color: var(--gold-light); }
  body.has-notice .row { height: 67vh; }

  /* units goal slide */
  .goalnum { font-family: "Frank Ruhl Libre", serif; font-weight: 700; font-size: clamp(60px, min(8.5vw, 15vh), 210px); line-height: 1; color: var(--green); font-variant-numeric: tabular-nums; }
  .goalnum small { font-size: .36em; font-weight: 500; color: #666; }
  .goalbar { width: 72%; height: 4.4vh; margin-top: 3vh; background: rgba(15, 69, 55, .12); border-radius: 99px; overflow: hidden; }
  .goalbar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), #1f8a70); border-radius: inherit; }
  .goalpct { margin-top: 1.8vh; font-weight: 600; font-size: clamp(16px, min(1.8vw, 3.2vh), 44px); color: var(--gold); }

  /* NIGHT: outside office hours the screen goes dark - just a dim clock that moves a little every minute
     (so nothing burns into the TV), no colors, no confetti. */
  body.night { background: #070a09; }
  body.night::before, body.night::after, body.night .topbar, body.night .row, body.night #confetti { display: none; }
  #night { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; background: #070a09; color: rgba(255, 255, 255, .45); text-align: center; }
  #night .nbox { transition: transform 2s ease; }
  #nclock { font-weight: 400; font-size: clamp(60px, 20vh, 300px); line-height: 1; font-variant-numeric: tabular-nums; }
  #ndate { font-size: clamp(16px, 3.4vh, 48px); margin-top: 2vh; }
  #nhdate { font-size: clamp(16px, 3.4vh, 48px); margin-top: 1vh; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="greet">
      <div id="greeting">Welcome</div>
      <div class="welcome" id="sub">Welcome to RM Support</div>
    </div>
    <div class="when">
      <div id="clock"></div>
      <div class="dates"><span id="date"></span><span class="dot">·</span><span id="hdate" class="heb" lang="he" dir="rtl"></span></div>
      <div class="zmanim" id="zmanim" lang="he" dir="rtl"></div>
    </div>
    <div class="wx" id="wx" hidden>
      <div id="wxIcon"></div>
      <div>
        <div id="wxTemp"></div>
        <div id="wxText"></div>
        <div id="wxNext"></div>
      </div>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="row">
    <!-- LEFT SIGN: arrow points left (names come from config.json "signs") -->
    <aside class="way" id="signLeft" aria-label="To the left">
      <svg viewBox="0 0 100 60" aria-hidden="true"><path d="M96 30H14M36 6 10 30l26 24" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="places"></div>
    </aside>

    <main class="card">
      <img class="logo" src="logo.jpg" alt="RM Support">
      <div class="qr" id="qrRight" hidden><canvas width="1" height="1"></canvas><div></div></div>
      <div class="qr left" id="qrLeft" hidden><canvas width="1" height="1"></canvas><div></div></div>
      <div class="stage" id="stage"></div>
    </main>

    <!-- RIGHT SIGN: arrow points right -->
    <aside class="way" id="signRight" aria-label="To the right">
      <svg viewBox="0 0 100 60" aria-hidden="true"><path d="M4 30h82M64 6l26 24-26 24" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="places"></div>
    </aside>
  </div>

  <div id="reached" hidden><div class="rbox"><div class="remoji">🎉</div><div class="rname" dir="auto"></div><div class="rwhat"></div></div></div>

  <div id="announce" hidden><div class="abox"><div class="alabel">Announcement</div><div class="atext" dir="auto"></div></div></div>

  <div id="mincha" hidden><div class="mbox"><div class="mword" lang="yi" dir="rtl">מנחה</div><div class="mwhen" lang="yi" dir="rtl"></div></div></div>

  <div id="night" hidden><div class="nbox"><div id="nclock"></div><div id="ndate"></div><div id="nhdate" class="heb" lang="he" dir="rtl"></div></div></div>

  <!-- Confetti, ONLY while the Mazal Tov slide shows (David 10-21): a gentle rain, and every 3 seconds one party
       popper from a different angle. -->
  <canvas id="confetti" aria-hidden="true" style="opacity:0"></canvas>
  <script>
  (() => {
    const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
    const COLORS = ["#0f4537", "#e8ec16", "#d9b56a", "#b8892d", "#1f8a70", "#ef6f6c", "#5b8def"];
    let W = 0, H = 0, dpr = 1, bits = [], active = false, popTimer = 0;
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;

    }
    const rnd = (a, b) => a + Math.random() * (b - a);

    // and come down one by one - never as a clump (David 10-21: "like 50 single pieces, not one bundle").
    const piece = (x, y, vx, vy, s, fade) => ({
      x, y, vx, vy, w: rnd(7, 15) * s, h: rnd(4, 8) * s, r: rnd(0, 6.28), vr: rnd(-0.25, 0.25),
      flip: rnd(0, 6.28), vf: rnd(0.08, 0.2), c: COLORS[(Math.random() * COLORS.length) | 0],
      round: Math.random() < 0.25, life: 1, fade,
      drag: rnd(0.972, 0.99),                    // air resistance
      slow: rnd(0.93, 0.985),                    // how fast the sideways push dies once it falls

      sway: rnd(0.3, 1.5) * s,                   // its own side-to-side flutter

    let tick = 0, waiting = [];

    // A popper every 3 seconds, each time from a different angle around the screen. It sprays plenty, wide and at
    // many speeds, so it scatters into single pieces. Never the same spot twice in a row.
    const POPPER = 110, CONE = 22;               // pieces per pop, and how wide the spray opens (degrees each way)
    const SPOTS = {

      bottomRight: () => pop(0.98 * W, H + 5, -125, CONE, 10, 27, POPPER),
      bottom:      () => pop(rnd(0.35, 0.65) * W, H + 5, -90, CONE, 12, 29, POPPER), // straight up from the floor
      left:        () => pop(-5, rnd(0.45, 0.7) * H, -40, CONE, 9, 26, POPPER),      // from the side, up and in
      right:       () => pop(W + 5, rnd(0.45, 0.7) * H, -140, CONE, 9, 26, POPPER),

    const RAIN_PER_SEC = 18;

      const s = Math.max(W, H) / 1000;
      let n = RAIN_PER_SEC / 60;                  // per frame (fractions add up over frames)
      while (n > 0) {
        if (Math.random() < Math.min(1, n)) bits.push(piece(rnd(0, W), rnd(-40, -10), rnd(-0.6, 0.6) * s, rnd(1, 2) * s, s, 0.0012));

        if (now.length) waiting = waiting.filter((w) => w.at > tick);

      const g = Math.max(W, H) / 1000 * 0.32;    // gravity
      for (const b of bits) {
        b.vy += g; b.vx *= b.drag; b.vy *= b.drag;

        else ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      }
      bits = bits.filter((b) => b.life > 0 && b.y < H + 40);
    }
    // The slides switch it on and off. Off = the whole layer fades out, then it is emptied.
    window.setConfetti = (on) => {
      if (on === active) return;
      active = on;
      clearTimeout(popTimer);
      if (on) {
        bits = []; waiting = [];
        cv.style.opacity = "1";
        popTimer = setTimeout(burst, 400);
      } else {
        cv.style.opacity = "0";
        setTimeout(() => { if (!active) { bits = []; waiting = []; ctx.clearRect(0, 0, W, H); } }, 900);
      }

    requestAnimationFrame(frame);

  <!-- QR code drawing (only used when config.json has a QR link). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
  (() => {

    const CONFIG_URL = "https://carehub.rmsupportva.com/share/office-screen";
    const KEY = (location.hash.match(/key=([^&]+)/) || [])[1] || "";   // the TV opens .../#key=... ; the key is never in this file

    function ny(d = new Date()) {

    // ---------- Automatic greeting ----------

    function setTime(box, now) {

        ? [

            ["סוז״ק מג״א", minute(at(alos + 3 * shaahMga), false)],
            ["גר״א", minute(at(rise.getTime() + 3 * shaah), false)],
            ["סוז״ת", minute(at(rise.getTime() + 4 * shaah), false)],

            ["מנחה גדולה", minute(at(rise.getTime() + 6.5 * shaah), true)],

    function wxIcon(t, day) {

    function wifiText(w) {

      const type = w.password ? (w.type === "WEP" ? "WEP" : "WPA") : "nopass";
      return `WIFI:T:${type};S:${esc(w.ssid)};${w.password ? `P:${esc(w.password)};` : ""}${w.hidden ? "H:true;" : ""};`;
    }
    // Up to two QR codes (David 10-21: the Wi-Fi, and the copy machine / scanner): the first in the card's
    // top-right corner, the second top-left. Each is a link or a Wi-Fi network; the Wi-Fi password comes from
    // CareHub's admin page, never from this public code.
    function qrItems() {                         // by position: an empty first code leaves the top-right corner empty
      const usable = (x) => (x && (wifiText(x.wifi) || String(x.link || "").trim()) ? x : null);

    function drawQR(box, item) {

    function mazalSlide(m) {
      const s = el("section", "slide"); s.dataset.kind = "mazal";
      const mid = el("div", "middle");
      mid.append(el("h1", "headline", m.headline || "מזל טוב", { dir: "auto" }));
      const lines = list(m.lines).filter((x) => String(x).trim());
      if (lines.length) {
        const rot = el("div", "label rotator");
        lines.forEach((t, i) => rot.append(el("span", i ? null : "on", t)));
        mid.append(rot);
      }
      mid.append(el("div", "rule", null, { "aria-hidden": "true" }));
      s.append(mid);
      if (m.bottom || m.bottomStrong) {
        const b = el("p", "bottom", m.bottom ? m.bottom + " " : "");
        if (m.bottomStrong) b.append(el("strong", null, m.bottomStrong));
        s.append(b);
      }
      return s;
    }
    function peopleSlide(kind, who) {
      const s = el("section", "slide"); s.dataset.kind = kind;
      const mid = el("div", "middle");
      mid.append(el("div", "label", "Today we celebrate"));
      mid.append(el("h1", "headline sm", kind === "birthday" ? "Happy Birthday!" : "Happy Work Anniversary!"));
      mid.append(el("div", "rule", null, { "aria-hidden": "true" }));
      const names = el("div", who.length > 4 ? "names many" : "names");
      for (const w of who) {
        const y = +w.years;
        names.append(el("span", null, kind === "anniversary" && y > 0 ? `${w.name} · ${y} year${y === 1 ? "" : "s"}` : w.name));
      }
      mid.append(names);
      s.append(mid);
      return s;
    }
    function messageSlide(m) {
      const s = el("section", "slide"); s.dataset.kind = "message";
      const mid = el("div", "middle");
      if (m.title) mid.append(el("h1", "headline sm", m.title, { dir: "auto" }));
      if (m.title && m.text) mid.append(el("div", "rule", null, { "aria-hidden": "true" }));
      if (m.text) mid.append(el("p", "msg", m.text, { dir: "auto" }));
      s.append(mid);
      return s;
    }
    function statsSlide(stats) {
      const s = el("section", "slide"); s.dataset.kind = "stats";
      const mid = el("div", "middle");
      mid.append(el("div", "label", "RM Support by the numbers"));
      const tiles = el("div", "tiles");
      for (const x of stats) {
        const t = el("div", "tile");
        const n = el("div", "num", "0"); n.dataset.v = String(Math.round(+x.value));
        t.append(n, el("div", "what", x.label));
        tiles.append(t);
      }
      mid.append(tiles);
      s.append(mid);
      return s;
    }
    function welcomeSlide(names) {
      const s = el("section", "slide"); s.dataset.kind = "welcome";
      const mid = el("div", "middle");
      mid.append(el("div", "label", "Today we welcome"));
      mid.append(el("h1", "headline sm", names.length === 1 ? `Welcome, ${names[0]}!` : "Welcome!", { dir: "auto" }));
      if (names.length > 1) {
        mid.append(el("div", "rule", null, { "aria-hidden": "true" }));
        const box = el("div", names.length > 4 ? "names many" : "names");
        for (const n of names) box.append(el("span", null, n));
        mid.append(box);
      }
      s.append(mid);
      return s;
    }
    function shoutSlide(x) {
      const s = el("section", "slide"); s.dataset.kind = "shoutout";
      const mid = el("div", "middle");
      mid.append(el("div", "label", "Shout-out ⭐"));
      mid.append(el("h1", "headline sm", x.name, { dir: "auto" }));
      if (x.text) { mid.append(el("div", "rule", null, { "aria-hidden": "true" }), el("p", "msg", x.text, { dir: "auto" })); }
      s.append(mid);
      return s;
    }
    function goalSlide(g) {
      const s = el("section", "slide"); s.dataset.kind = "goal";
      const mid = el("div", "middle");
      const done = g.units >= g.target, pct = Math.min(100, Math.round((g.units / g.target) * 100));
      mid.append(el("div", "label", "Today's goal"));
      const n = el("div", "goalnum", g.units.toLocaleString("en-US"));
      n.append(el("small", null, ` / ${g.target.toLocaleString("en-US")} units`));
      const bar = el("div", "goalbar"), fill = el("i");
      fill.dataset.w = String(pct);
      bar.append(fill);
      mid.append(n, bar, el("div", "goalpct", done ? "Goal reached! 🎉" : `${pct}% - ${(g.target - g.units).toLocaleString("en-US")} to go`));
      if (g.each && g.people) {
        const who = `${g.each} each · ${g.people} ${g.people === 1 ? "person" : "people"} · ${g.reached || 0} reached ${g.each} ✓`;
        mid.append(el("div", "what", who));
      }
      s.append(mid);
      return s;
    }
    // Photos come from CareHub with the same key header as the feed (an <img> can't send headers), kept as blobs.
    const PHOTO_URL = CONFIG_URL + "/photo";
    const photoBlobs = new Map();
    function photoSrc(id) {
      if (!photoBlobs.has(id)) {
        photoBlobs.set(id, fetch(`${PHOTO_URL}?id=${id}`, { headers: { "X-Screen-Key": decodeURIComponent(KEY) } })
          .then((r) => (r.ok ? r.blob() : Promise.reject(r.status)))
          .then((b) => URL.createObjectURL(b))
          .catch(() => { photoBlobs.delete(id); return ""; }));
      }
      return photoBlobs.get(id);
    }
    function photoSlide(ph) {
      const s = el("section", "slide"); s.dataset.kind = "photo";
      const mid = el("div", "middle"), img = el("img", "photo", null, { alt: ph.caption || "Photo" });
      photoSrc(ph.id).then((u) => { if (u) img.src = u; });
      mid.append(img);
      if (ph.caption) mid.append(el("div", "photocap", ph.caption, { dir: "auto" }));
      s.append(mid);
      return s;
    }
    function weatherSlide() {
      const s = el("section", "slide"); s.dataset.kind = "weather";
      const mid = el("div", "middle");
      mid.append(el("div", "label", "5-day weather · Monroe, NY"), el("div", "wxdays"));
      s.append(mid);
      fillWeather(s);
      return s;
    }
    function fillWeather(s) {
      const box = s.querySelector(".wxdays");
      box.textContent = "";
      for (const d of forecast) {
        const c = el("div", "wxday"), t = el("div", "t", `${d.hi}°`);
        if (d.lo != null) t.append(el("small", null, ` / ${d.lo}°`));
        c.append(el("div", "d", d.name), el("div", "i", d.icon), t, el("div", "x", d.text));
        box.append(c);
      }
    }
    function countUp(s) {                        // numbers roll up from 0 each time the slide comes on
      for (const n of s.querySelectorAll(".num")) {
        const end = +n.dataset.v, t0 = Date.now();
        clearInterval(n._t);
        n.textContent = "0";
        n._t = setInterval(() => {
          const k = Math.min(1, (Date.now() - 500 - t0) / 1600);
          if (k <= 0) return;
          n.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))).toLocaleString("en-US");
          if (k >= 1) clearInterval(n._t);
        }, 40);
      }
    }

    let slides = [], cur = -1, slideTimer = 0, night = false, minchaOn = false, annOn = false;
    function build(p) {
      const stage = $("stage");
      const was = slides[cur] ? slides[cur].dataset.kind : "";   // new content (a number changed) keeps the slide on screen
      stage.textContent = "";
      slides = [];
      if (cfg.mazal && cfg.mazal.show !== false) slides.push(mazalSlide(cfg.mazal));
      for (const kind of ["birthday", "anniversary"]) {
        const who = list(cfg.people).filter((x) => x && x.name && x.kind === kind && +x.month === p.month && +x.day === p.day);
        if (who.length) slides.push(peopleSlide(kind, who));
      }
      const welcome = list(cfg.welcome).filter((n) => typeof n === "string" && n.trim());
      if (welcome.length) slides.push(welcomeSlide(welcome));
      for (const x of list(cfg.shoutouts)) if (x && x.name) slides.push(shoutSlide(x));
      for (const m of list(cfg.slides)) {
        if (m && (m.title || m.text) && (!m.from || m.from <= p.ymd) && (!m.to || p.ymd <= m.to)) slides.push(messageSlide(m));
      }
      const stats = list(cfg.stats).filter((x) => x && x.label && Number.isFinite(+x.value));
      if (stats.length) slides.push(statsSlide(stats));
      const g = cfg.goal;
      if (g && Number.isFinite(+g.units) && +g.target > 0) slides.push(goalSlide({ units: +g.units, target: +g.target, each: +g.each || 0, people: +g.people || 0, reached: +g.reached || 0 }));
      for (const ph of list(cfg.photos)) if (ph && /^[0-9a-f-]{36}$/.test(ph.id)) slides.push(photoSlide(ph));
      if (cfg.forecast !== false && forecast.length) slides.push(weatherSlide());
      if (!slides.length) slides.push(messageSlide({ title: "Welcome to RM Support" }));
      for (const s of slides) stage.append(s);
      cur = was ? slides.findIndex((s) => s.dataset.kind === was) : -1;
      rotate(true);
    }
    // confetti only while the Mazal Tov slide shows, and never under a pop-up
    const confetti = () => {
      const s = slides[cur];
      window.setConfetti(!!s && s.dataset.kind === "mazal" && !night && !minchaOn && !annOn);
    };
    const HAPPY = new Set(["mazal", "birthday", "anniversary", "welcome", "shoutout"]);
    function show(i, now) {
      slides.forEach((s, j) => { s.classList.toggle("now", !!now); s.classList.toggle("on", j === i); });
      cur = i;
      const s = slides[i];
      document.querySelector(".card").classList.toggle("happy", !!s && HAPPY.has(s.dataset.kind));
      confetti();
      if (s && s.dataset.kind === "stats") countUp(s);
      if (s && s.dataset.kind === "goal") {      // the bar fills each time the slide comes on (timer-driven, like countUp)
        const fill = s.querySelector(".goalbar > i"), end = +fill.dataset.w, t0 = Date.now();
        clearInterval(fill._t);
        fill.style.width = "0";
        fill._t = setInterval(() => {
          const k = Math.min(1, Math.max(0, (Date.now() - 600 - t0) / 1800));
          fill.style.width = (end * (1 - Math.pow(1 - k, 3))).toFixed(1) + "%";
          if (k >= 1) clearInterval(fill._t);
        }, 40);
      }
      if (now) { void $("stage").offsetWidth; setTimeout(() => slides.forEach((x) => x.classList.remove("now")), 50); }
    }
    function rotate(first) {
      clearInterval(slideTimer);
      if (night) { window.setConfetti(false); return; }
      show(cur < 0 || cur >= slides.length ? 0 : cur, first);
      const sec = Math.max(5, +cfg.seconds || 20);
      if (slides.length > 1) slideTimer = setInterval(() => show((cur + 1) % slides.length), sec * 1000);
    }
    // the gold line under the Mazal Tov headline switches every 3.5 seconds
    setInterval(() => {
      for (const rot of document.querySelectorAll(".rotator")) {
        const sp = [...rot.children]; if (sp.length < 2) continue;
        const i = sp.findIndex((x) => x.classList.contains("on"));
        sp.forEach((x) => x.classList.remove("on"));
        sp[(i + 1) % sp.length].classList.add("on");
      }
    }, 3500);

    // ---------- Sun times for Monroe, NY (the NOAA solar calculator's equations, Meeus) ----------
    // Sunrise / sunset at sea level (90.833 deg: refraction + the sun's half-width), as instants. Cached per day.
    const sunCache = {};
    function sunTimes(ymd) {
      if (sunCache[ymd]) return sunCache[ymd];
      const [Y, M, D] = ymd.split("-").map(Number), lat = 41.3309, lng = -74.1868;
      const rad = Math.PI / 180, sin = (d) => Math.sin(d * rad), cos = (d) => Math.cos(d * rad);
      const day0 = Date.UTC(Y, M - 1, D), jd0 = day0 / 864e5 + 2440587.5;
      function sun(jd) {                          // the sun's declination (deg) and the equation of time (minutes)
        const T = (jd - 2451545) / 36525;
        const L0 = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360;
        const Ma = 357.52911 + T * (35999.05029 - 0.0001537 * T);
        const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
        const C = sin(Ma) * (1.914602 - T * (0.004817 + 0.000014 * T)) + sin(2 * Ma) * (0.019993 - 0.000101 * T) + sin(3 * Ma) * 0.000289;
        const om = 125.04 - 1934.136 * T, lambda = L0 + C - 0.00569 - 0.00478 * sin(om);
        const eps = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60 + 0.00256 * cos(om);
        const decl = Math.asin(sin(eps) * sin(lambda)) / rad;
        const y = Math.tan((eps / 2) * rad) ** 2;
        const eq = 4 / rad * (y * sin(2 * L0) - 2 * e * sin(Ma) + 4 * e * y * sin(Ma) * cos(2 * L0) - 0.5 * y * y * sin(4 * L0) - 1.25 * e * e * sin(2 * Ma));
        return { decl, eq };
      }
      function event(rising) {
        let t = 720 - 4 * lng;                    // minutes after 0:00 UTC, refined twice
        for (let i = 0; i < 3; i++) {
          const { decl, eq } = sun(jd0 + t / 1440);
          const ha = Math.acos(cos(90.833) / (cos(lat) * cos(decl)) - Math.tan(lat * rad) * Math.tan(decl * rad)) / rad;
          t = 720 - 4 * (lng + (rising ? ha : -ha)) - eq;
        }
        return new Date(day0 + t * 60000);
      }
      return (sunCache[ymd] = { rise: event(true), set: event(false) });
    }
    // Sunset as "HH:MM" New York time, rounded DOWN (a zmanim calendar never shows shkiah late).
    const sunset = (ymd) => ny(new Date(Math.floor(sunTimes(ymd).set.getTime() / 60000) * 60000)).hm;

    // ---------- Office hours -> day / night ----------
    // A closing time can be "HH:MM" or "sunset-120" (= 120 minutes before sunset; David 10-21: Friday until
    // 2 hours before sunset).
    function timeOf(v, p) {
      const m = /^sunset-(\d{1,3})$/.exec(String(v));
      if (!m) return String(v);
      const [h, mi] = sunset(p.ymd).split(":").map(Number), x = h * 60 + mi - +m[1];
      return `${String(Math.floor(x / 60)).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`;
    }
    function open(p) {
      const hours = cfg.hours;
      if (!hours || typeof hours !== "object") return true;
      const h = hours[p.dow];
      return Array.isArray(h) && h.length === 2 && p.hm >= timeOf(h[0], p) && p.hm < timeOf(h[1], p);
    }
    function tickDay(p) {
      const isNight = !open(p);
      if (isNight !== night) {
        night = isNight;
        document.body.classList.toggle("night", night);
        $("night").hidden = !night;
        rotate(true);
      }
      if (p.ymd !== dayKey) { dayKey = p.ymd; build(p); }   // new day: birthdays, dated messages
    }

    // ---------- Mincha pop-up (every day the screen is on) ----------
    function mincha(p) {
      const m = cfg.mincha || {}, box = $("mincha"), when = box.querySelector(".mwhen");
      const t = m.show !== false && /^\d{2}:\d{2}$/.test(m.time || "") ? m.time : "";
      const min = (hm) => +hm.slice(0, 2) * 60 + +hm.slice(3, 5);
      const before = Number.isFinite(+m.before) ? +m.before : 15, after = Number.isFinite(+m.after) ? +m.after : 15;
      const left = t ? min(t) - min(p.hm) : 0;            // minutes until Mincha (0 = now, below 0 = started)
      const on = !!t && !night && ((left > 0 && left <= before) || (left <= 0 && -left < after));
      when.textContent = on && left > 0 ? `אין ${left} מינוט` : "";
      when.hidden = !(on && left > 0);
      if (on === minchaOn) return;
      minchaOn = on;
      box.hidden = !on;
      if (on) { const b = box.firstElementChild; b.style.animation = "none"; void b.offsetWidth; b.style.animation = ""; }
      if (on && left > 0) chime();               // David 10-21: a sound when the Mincha pop-up comes up
      confetti();
    }
    // A soft three-note bell, made in the browser (no sound file). Chrome plays it only if the TV's browser allows
    // sound without a click: start it with --autoplay-policy=no-user-gesture-required, or tap the screen once.
    let audio = null;
    function chime() {
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        if (audio.state === "suspended") audio.resume();
        const t0 = audio.currentTime + 0.05;
        [784, 659, 523].forEach((hz, i) => {        // G5, E5, C5
          const o = audio.createOscillator(), g = audio.createGain(), t = t0 + i * 0.55;
          o.type = "sine"; o.frequency.value = hz;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
          o.connect(g).connect(audio.destination);
          o.start(t); o.stop(t + 1.7);
        });
      } catch {}
    }
    addEventListener("pointerdown", () => { try { audio = audio || new AudioContext(); audio.resume(); } catch {} }, { once: true });

    // ---------- Announcement pop-up (from CareHub's "Show now"; checked every second, so it ends on time) ----------
    function announceTick() {
      const a = cfg.announce, box = $("announce");
      const on = !!(a && a.text && Date.parse(a.until) > Date.now());
      if (on) box.querySelector(".atext").textContent = a.text;
      if (on === annOn) return;
      annOn = on;
      box.hidden = !on;
      if (on) { const b = box.firstElementChild; b.style.animation = "none"; void b.offsetWidth; b.style.animation = ""; }
      confetti();
    }

    // ---------- "Reached the goal" pop-up ----------
    let rQueue = [], rOn = false, rUntil = 0, rDay = "";
    const rSeen = new Set();
    function reachedTick(p) {
      if (p.ymd !== rDay) {                      // a new day: forget yesterday's names
        rDay = p.ymd; rSeen.clear(); rQueue = [];
        try { for (const n of JSON.parse(localStorage.getItem("reached:" + rDay) || "[]")) rSeen.add(n); } catch {}
      }
      const g = cfg.goal;
      for (const n of list(g && g.names)) {
        if (typeof n === "string" && n && !rSeen.has(n)) { rSeen.add(n); rQueue.push(n); }
      }
      try { localStorage.setItem("reached:" + rDay, JSON.stringify([...rSeen])); } catch {}
      const box = $("reached");
      if (rOn && Date.now() < rUntil) return;
      const free = !night && !annOn && !minchaOn;
      const next = free ? rQueue.shift() : null;
      if (next) {
        box.querySelector(".rname").textContent = next;
        box.querySelector(".rwhat").textContent = `reached ${(g && g.each) || 60} units!`;
        box.hidden = false; rOn = true; rUntil = Date.now() + 12_000;
        const b = box.firstElementChild; b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
      } else if (rOn) {
        box.hidden = true; rOn = false;
      }
    }

    // ---------- Office closed notice (a ribbon over the card, from a few days before) ----------
    const LONGDAY = new Intl.DateTimeFormat("en-US", { timeZone: "UTC", weekday: "long", month: "long", day: "numeric" });
    function notice(p) {
      const box = $("notice"), days = list(cfg.closures).filter((x) => x && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && x.date >= p.ymd);
      box.textContent = "";
      days.forEach((x, i) => {
        const [y, m, d] = x.date.split("-").map(Number);
        const when = x.date === p.ymd ? "today" : LONGDAY.format(new Date(Date.UTC(y, m - 1, d, 12)));
        if (i) box.append(" · ");
        box.append("Office closed ");
        box.append(el("b", null, when));
        if (x.reason) box.append(` - ${x.reason}`);
      });
      box.hidden = !days.length;
      document.body.classList.toggle("has-notice", days.length > 0);
    }

    // ---------- Load content now, then every 20 seconds (changes show without reloading) ----------
    async function load() {
      for (const u of [CONFIG_URL && KEY ? CONFIG_URL : "", "config.json"]) {
        if (!u) continue;
        try {
          const r = u === CONFIG_URL
            ? await fetch(u, { cache: "no-store", headers: { "X-Screen-Key": decodeURIComponent(KEY) } })
            : await fetch(u + "?v=" + Date.now(), { cache: "no-store" });
          if (!r.ok) continue;
          const j = await r.json();
          if (j && typeof j === "object" && !Array.isArray(j)) return j;
        } catch {}
      }
      return null;
    }
    function apply(j) {
      const text = JSON.stringify(j);
      if (text === cfgText) return;
      cfgText = text;
      cfg = Object.assign({}, DEFAULT, j);
      signs(); qr();
      shownMinute = ""; dayKey = "";             // redo the day check and the slides with the new content
      clock();
      announceTick();
    }
    apply(DEFAULT);
    setInterval(() => { clock(); announceTick(); reachedTick(ny()); }, 1000);
    load().then((j) => j && apply(j));
    setInterval(() => load().then((j) => j && apply(j)), 20000);
    weather();
    setInterval(weather, 15 * 60000);
  })();
  </script>

  <!-- Picks up a new LOOK without anyone touching the TV: every 60 seconds it checks the published page and reloads
       ONLY if the page changed, so the colors and confetti never jump. (Plus a fresh start every 6 hours.) -->
  <script>
  (() => {
    const url = () => location.pathname + "?check=" + Date.now();
    const get = () => fetch(url(), { cache: "no-store" }).then((r) => (r.ok ? r.text() : null)).catch(() => null);
    let first = null;
    get().then((t) => { first = t; });
    setInterval(() => get().then((t) => { if (t && first && t !== first) location.reload(); else if (t && !first) first = t; }), 60000);
    setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
  })();
  </script>
</body>
